# Docker Swarm stack for Portainer: runs the Termix image built from this
# fork by .github/workflows/songhai-image.yml behind the existing Traefik.
#
# Deployed in Portainer as the stack "ssh_termix", so the Termix service is
# reachable on the Traefik network as ssh_termix_termix:8080.
#
# Routing: the Traefik on this Swarm (v2.10) only uses its file provider and
# ignores service labels. The route lives in /opt/traefik/config.toml on the
# manager node:
#
#   [http.routers.termix]
#     rule = "Host(`ssh.songhai.cc`)"
#     entrypoints = ["web","websecure"]
#     service = "termix"
#     [http.routers.termix.tls]
#       certResolver = "letsencrypt"
#   [http.services.termix.loadBalancer]
#     [[http.services.termix.loadBalancer.servers]]
#       url = "http://ssh_termix_termix:8080"
#
# Environment variables (set in the stack, defaults shown):
#   TERMIX_IMAGE       ghcr.io/mutambe/termix:latest
#   TERMIX_PLACEMENT   node.role == manager   termix and guacd share a local
#                                             volume, so both run on this node
#   TRAEFIK_NETWORK    traefik_public         overlay network Traefik is attached to

version: "3.8"

services:
  termix:
    image: ${TERMIX_IMAGE:-ghcr.io/mutambe/termix:latest}
    volumes:
      - termix-data:/app/data
    environment:
      PORT: "8080"
      GUACD_HOST: "guacd"
      GUACD_TUNNEL_HOST: "termix"
      GUACD_RECORDING_PATH: "/termix-data/session_recordings/guacamole"
      GUACD_DRIVE_PATH: "/termix-data/rdp-drive"
      # The image ships with product analytics enabled; an empty key turns it off.
      # POSTHOG_API_KEY: ""
    networks:
      - termix-net
      - traefik
    deploy:
      replicas: 1
      placement:
        constraints:
          - ${TERMIX_PLACEMENT:-node.role == manager}
      restart_policy:
        condition: any

  guacd:
    image: guacamole/guacd:1.6.0
    volumes:
      - termix-data:/termix-data
    networks:
      - termix-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - ${TERMIX_PLACEMENT:-node.role == manager}
      restart_policy:
        condition: any

volumes:
  termix-data:
    driver: local

networks:
  termix-net:
    driver: overlay
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_public}
